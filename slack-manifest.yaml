display_information:
  name: Deals
  description: My open Org62 opportunities
  background_color: "#1b5e20"
features:
  bot_user:
    display_name: deals
    always_online: true
  slash_commands:
    - command: /deals
      description: List my open Org62 opportunities
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
