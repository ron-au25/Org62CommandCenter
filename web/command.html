<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org62 Command Center</title>
<style>
  :root {
    --bg:#0b0f17; --panel:#121826; --panel2:#0f1521; --line:#1e2637;
    --ink:#e6ebf2; --mut:#8b97a8; --dim:#5c6a7e;
    --accent:#2e8b57; --accent2:#4c9ffe; --good:#37c871; --warn:#ffb020; --bad:#ff5c5c;
    --chip:#1a2436;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); }
  a { color:var(--accent2); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel2);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  header .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--accent2));
                 display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
  header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; }
  header .sub { color:var(--mut); font-size:11.5px; }
  header .spacer { flex:1; }
  .badge { font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .badge.live { background:rgba(55,200,113,.15); color:var(--good); }
  .badge.snapshot { background:rgba(255,176,32,.15); color:var(--warn); }
  #refresh { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:8px;
             padding:6px 12px; font-size:12px; font-weight:650; cursor:pointer; display:flex; gap:6px; align-items:center; }
  #refresh:hover { border-color:var(--accent2); }
  #refresh[disabled] { opacity:.5; cursor:default; }
  #refresh .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--dim);
                   border-top-color:var(--accent2); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #settings-btn { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:8px;
             padding:6px 10px; font-size:13px; font-weight:650; cursor:pointer; position:relative; }
  #settings-btn:hover { border-color:var(--accent2); }
  .popover { position:absolute; top:calc(100% + 6px); right:0; background:var(--panel); border:1px solid var(--line);
             border-radius:10px; padding:14px; width:240px; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:25; display:none; }
  .popover.open { display:block; }
  .popover h4 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); }
  .seg { display:flex; gap:4px; margin-bottom:14px; }
  .seg button { flex:1; background:var(--chip); color:var(--mut); border:1px solid var(--line); border-radius:7px;
                padding:6px 4px; font-size:11.5px; font-weight:650; cursor:pointer; }
  .seg button.active { color:var(--accent2); border-color:var(--accent2); background:rgba(76,159,254,.12); }
  .popover .toggle { width:100%; justify-content:space-between; }
  .popover .ver { margin-top:14px; padding-top:10px; border-top:1px dashed var(--line); font-size:11px; color:var(--dim); }
  .popover .ver b { color:var(--mut); }
  .tginputs { display:flex; gap:8px; margin-bottom:2px; }
  .tginputs label { flex:1; font-size:10.5px; color:var(--mut); display:flex; flex-direction:column; gap:3px; }
  .tginputs input { background:var(--chip); border:1px solid var(--line); border-radius:6px; color:var(--ink);
                    padding:5px 6px; font-size:12px; width:100%; }
  .tginputs input:focus { outline:none; border-color:var(--accent2); }

  /* quarterly target progress bars */
  .tgrow + .tgrow { margin-top:14px; }
  .tgtop { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; margin-bottom:5px; }
  .tgtop b { font-size:13px; }
  .tgwrap { position:relative; height:14px; }
  .tgbar { position:absolute; inset:0; background:var(--chip); border-radius:7px; overflow:hidden; }
  .tgfill { height:100%; border-radius:7px; }
  .tgmark { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.55; }
  .tgmeta { font-size:11px; margin-top:5px; }

  /* static pipeline-movements strip: top 10 latest, one line, hover for full detail */
  #movebar { background:var(--panel2); border-bottom:1px solid var(--line); position:sticky; top:57px; z-index:19; }
  #movebar .mvtrack { display:flex; overflow-x:auto; scrollbar-width:thin; }
  .mvchip { flex:0 0 auto; display:flex; flex-direction:column; gap:2px; padding:5px 12px; border-right:1px solid var(--line);
            font-size:11.5px; white-space:nowrap; cursor:pointer; }
  .mvchip:hover { background:rgba(76,159,254,.08); }
  .mvchip .acc { font-weight:700; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  .mvchip .mv-row { display:flex; gap:6px; }
  .mvchip .delta { font-weight:700; }
  .mv-up { color:var(--good); }
  .mv-down { color:var(--bad); }
  .mv-flat, .mv-neutral { color:var(--mut); }

  /* shared rich hover tooltip (movement chips, activity calendar) */
  .tooltip { position:fixed; z-index:50; display:none; background:var(--panel); border:1px solid var(--line);
           border-radius:9px; padding:10px 13px; font-size:12px; line-height:1.55; max-width:280px;
           box-shadow:0 8px 24px rgba(0,0,0,.4); pointer-events:none; }
  .tooltip .acc { font-weight:700; font-size:13px; }
  .tooltip .opp { color:var(--mut); font-size:11.5px; margin-top:1px; }
  .tooltip .row { margin-top:5px; display:flex; gap:6px; }
  .tooltip .row .lbl { color:var(--mut); min-width:48px; }
  .tooltip .date { color:var(--dim); font-size:11px; margin-top:6px; }

  .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; padding:16px 20px 4px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-height:78px; }
  .kpi .lab { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .kpi .val { font-size:22px; font-weight:750; margin-top:6px; font-variant-numeric:tabular-nums; }
  .kpi .meta { color:var(--dim); font-size:11px; margin-top:2px; }
  .kpi.risk .val { color:var(--warn); }
  .kpi.risk { cursor:pointer; }
  .kpi.risk:hover { border-color:var(--warn); }
  .kpi.risk.active { border-color:var(--warn); background:rgba(255,176,32,.08); }
  .kpi[data-tab] { cursor:pointer; }
  .kpi[data-tab]:hover { border-color:var(--accent2); }

  .risk-panel { margin:0 20px 16px; }
  .risk-panel h3 { color:var(--warn); }
  .risk-rules { margin:8px 0; font-size:12.5px; }
  .risk-rules div { padding:3px 0; }
  .risk-rules b { font-variant-numeric:tabular-nums; }

  .tabs { display:flex; gap:4px; padding:12px 20px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab { padding:9px 15px; cursor:pointer; color:var(--mut); border-bottom:2px solid transparent; font-weight:650; font-size:13px; }
  .tab.active { color:var(--ink); border-bottom-color:var(--accent2); }
  main { padding:18px 20px 40px; }

  .bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  input[type=search] { flex:1; min-width:200px; padding:9px 12px; background:var(--panel); border:1px solid var(--line);
                       border-radius:8px; font-size:13px; color:var(--ink); }
  input[type=search]::placeholder { color:var(--dim); }
  .toggle { display:flex; align-items:center; gap:7px; color:var(--mut); font-size:12.5px; cursor:pointer; user-select:none;
            background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .toggle input { accent-color:var(--accent2); }

  .ttrack { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-bottom:20px; }
  .fmix { margin-bottom:16px; }
  .fmix-bar { display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--chip); margin:10px 0 12px; }
  .fmix-bar i { display:block; height:100%; }
  .fmix-rows { display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; color:var(--mut); }
  .fmix-rows .r { display:flex; align-items:center; gap:4px; }
  .fmix-rows .r b.dot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:3px; }
  .fmix-rows .r b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 10px; font-size:13px; font-weight:700; }
  .card .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .card .row:last-child { border-bottom:none; }
  .card .row b { font-variant-numeric:tabular-nums; }
  .card .row .k { color:var(--mut); }
  .vbar { height:6px; background:var(--chip); border-radius:4px; margin-top:10px; overflow:hidden; }
  .vbar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }

  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line);
          border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:var(--panel2); font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em;
       cursor:pointer; user-select:none; white-space:nowrap; }
  th.num, td.num { text-align:right; white-space:nowrap; }
  td.close, th.close { white-space:nowrap; min-width:96px; }
  tr[data-id] { cursor:pointer; }
  tr:hover td { background:rgba(76,159,254,.05); }
  tr.dead td { opacity:.5; }
  tr.aligned td:first-child { border-left:3px solid var(--accent2); }
  tr.risk-row td:first-child { border-left:3px solid var(--warn); }
  tr.risk-row td { background:rgba(255,176,32,.06); }
  @keyframes rowFlash { from { background:rgba(76,159,254,.35); } to { background:transparent; } }
  tr.flash td { animation:rowFlash 1.6s ease; }
  .amt { font-variant-numeric:tabular-nums; font-weight:650; }
  .chip { background:var(--chip); color:var(--accent2); border-radius:6px; padding:1px 7px; font-size:11.5px; font-weight:650; }
  .pill { border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; }
  .pill.commit { background:rgba(55,200,113,.15); color:var(--good); }
  .pill.best   { background:rgba(76,159,254,.15); color:var(--accent2); }
  .pill.pipe   { background:rgba(139,151,168,.15); color:var(--mut); }
  .pill.closed { background:rgba(46,139,87,.2); color:var(--good); }
  .pill.dead   { background:rgba(255,92,92,.15); color:var(--bad); }
  .ctry { font-weight:700; color:var(--accent2); }
  .flag { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; margin-right:4px; display:inline-block; }
  .flag.stale { background:rgba(255,92,92,.15); color:var(--bad); }
  .flag.nns   { background:rgba(255,176,32,.15); color:var(--warn); }
  .flag.noamt { background:rgba(139,151,168,.15); color:var(--mut); }
  .flag.past  { background:rgba(255,92,92,.2); color:var(--bad); }
  .muted { color:var(--dim); }
  .err { background:rgba(255,176,32,.1); color:var(--warn); border:1px solid rgba(255,176,32,.3);
         padding:8px 12px; border-radius:8px; margin-bottom:14px; font-size:12.5px; }
  .note { background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:14px; color:var(--mut); }

  /* activity */
  .months { display:flex; align-items:flex-end; gap:6px; height:150px; padding:12px 0 0; }
  .months .m { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; }
  .months .m .stack { width:70%; display:flex; flex-direction:column-reverse; border-radius:4px 4px 0 0; overflow:hidden; }
  .months .m .stack i { display:block; width:100%; }
  .months .m span { font-size:10px; color:var(--mut); }
  .ctag { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }
  .legend { display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--mut); flex-wrap:wrap; }
  .legend b { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }

  /* detail drawer */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; }
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(460px,92vw); background:var(--panel2);
            border-left:1px solid var(--line); z-index:31; transform:translateX(100%); transition:transform .2s ease;
            overflow-y:auto; padding:0; }
  #drawer.open { transform:translateX(0); }
  #drawer .dh { position:sticky; top:0; background:var(--panel2); border-bottom:1px solid var(--line);
                padding:16px 18px; display:flex; gap:10px; align-items:flex-start; }
  #drawer .dh h2 { margin:0; font-size:15px; font-weight:700; line-height:1.3; }
  #drawer .dh .close { margin-left:auto; cursor:pointer; color:var(--mut); font-size:20px; line-height:1; }
  #drawer .body { padding:16px 18px 40px; }
  .kv { display:flex; gap:10px; padding:5px 0; font-size:12.5px; border-bottom:1px dashed var(--line); }
  .kv .k { color:var(--mut); min-width:92px; }
  .sect { margin-top:18px; }
  .sect h4 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent2); }
  .notebox { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
             font-size:12.5px; white-space:pre-wrap; margin-bottom:8px; }
  .notebox .lbl { color:var(--mut); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
  .ptable { width:100%; border-collapse:collapse; font-size:12px; }
  .ptable td { padding:5px 8px; border-bottom:1px solid var(--line); }
  .ptable td.num, .ptable th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .ptable th { position:sticky; top:0; background:var(--panel2); }
  .scroll { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .actitem { font-size:12px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .actitem .meta { color:var(--dim); font-size:11px; }
  /* activity calendar */
  .calbar { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .calbar b { font-size:14px; min-width:130px; text-align:center; }
  .calbar button { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:7px;
                   width:30px; height:28px; cursor:pointer; font-size:15px; }
  .calbar button:hover { border-color:var(--accent2); }
  .cal { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .cal .dow { text-align:center; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); padding:4px 0; }
  .cal .cell { min-height:92px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 6px; overflow:hidden; }
  .cal .cell.empty { background:transparent; border:none; }
  .cal .cell.today { border-color:var(--accent2); box-shadow:inset 0 0 0 1px var(--accent2); }
  .cal .dnum { font-size:11px; color:var(--mut); font-weight:700; display:flex; justify-content:space-between; margin-bottom:3px; }
  .cal .dnum .dmin { color:var(--dim); font-weight:600; }
  .cal .ev { font-size:10.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
             padding:1px 4px; border-radius:4px; margin-bottom:2px; border-left:3px solid var(--dim); background:var(--chip); }
  .cal .ev a { color:var(--ink); }
  .cal .ev b { display:none; }
  .cal .ev .evh { color:var(--dim); float:right; margin-left:6px; }
  .adot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .acctlegend { display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px; font-size:11px; color:var(--mut); }
  .acctlegend span b { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  .card.alert { border-color:rgba(255,92,92,.4); }
  .card.alert h3 { color:var(--bad); }
  .alertitem { font-size:12.5px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .alertitem:last-child { border-bottom:none; }
  .alertitem .meta { color:var(--mut); font-size:11px; margin-top:2px; }
</style>
</head>
<body>
<header>
  <div class="logo">62</div>
  <div>
    <h1>Org62 Command Center</h1>
    <div class="sub">Ron Shpilman · SE · Field Service ANZ · FY27</div>
  </div>
  <div class="spacer"></div>
  <button id="refresh" title="Resync with Org62">↻ Refresh</button>
  <span id="s-src" class="badge live">live</span>
  <div style="position:relative">
    <button id="settings-btn" title="Settings">⚙</button>
    <div class="popover" id="settings-pop">
      <h4>Role mode</h4>
      <div class="seg" id="role-seg">
        <button data-mode="fsl">FSL</button>
        <button data-mode="service_cloud">Service Cloud</button>
      </div>
      <h4>Quarterly targets (hrs)</h4>
      <div class="tginputs">
        <label>Related <input type="number" id="tg-related" min="0" step="1"></label>
        <label>Facing <input type="number" id="tg-facing" min="0" step="1"></label>
      </div>
      <h4 style="margin-top:14px">Alignment</h4>
      <label style="display:block">Aligned SEs (comma-separated)
        <input type="text" id="aligned-ses" placeholder="e.g. Jane Smith, John Doe" style="width:100%;margin-top:4px">
      </label>
      <h4 style="margin-top:14px">Display</h4>
      <label class="toggle"><input type="checkbox" id="movetog"> Show pipeline bar</label>
      <div class="ver">Version <b id="app-ver"></b></div>
    </div>
  </div>
</header>

<div id="movebar" style="display:none"><div class="mvtrack" id="mvtrack"></div></div>
<div id="tooltip" class="tooltip"></div>

<div class="kpis" id="kpis"></div>
<div id="risk-panel" class="card risk-panel" style="display:none"></div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="open">Open Pipe</div>
  <div class="tab" data-tab="closed">Closed Pipe</div>
  <div class="tab" data-tab="whitespace">New Business (ANZ White Space)</div>
  <div class="tab" data-tab="coach">Forecasting Coach</div>
  <div class="tab" data-tab="activity">Activity Log</div>
</div>

<main>
  <div id="err" class="err" style="display:none"></div>
  <div id="view"></div>
</main>

<div id="scrim"></div>
<aside id="drawer"><div id="drawer-inner"></div></aside>

<script>
const APP_VERSION = "1.3";
const SF = "https://org62.lightning.force.com/lightning/r/Opportunity/";
const STALE_DAYS = 90;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt  = n => n==null ? "—" : "$"+Math.round(n).toLocaleString();
const fmtK = n => n==null ? "—" : (Math.abs(n)>=1e6 ? "$"+(n/1e6).toFixed(2)+"M" : "$"+Math.round(n/1e3)+"K");
// DD Mmm YY  (2026-04-30 -> 30 Apr 26)
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d.length<=10 ? d+"T00:00:00" : d);
  if(isNaN(dt)) return d;
  return String(dt.getDate()).padStart(2,"0")+" "+MONTHS[dt.getMonth()]+" "+String(dt.getFullYear()).slice(-2);
}
// Stage "02 - Determining Problem..." -> "02"; no leading digits (e.g. "Dead - Lost") -> unchanged.
function stageShort(s){
  if(!s) return "—";
  const m=s.match(/^(\d+)/);
  return m?m[1]:s;
}
// Snapshot timestamp: DD Mmm YY HH:MM in Melbourne local time.
function fmtStamp(d){
  if(!d) return "";
  const dt = new Date(d.length<=10 ? d+"T00:00:00" : d);
  if(isNaN(dt)) return d;
  const p = new Intl.DateTimeFormat('en-US',{timeZone:'Australia/Melbourne',day:'2-digit',
    month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(dt);
  const g = t => (p.find(x=>x.type===t)||{}).value||"";
  return `${g('day')} ${g('month')} ${g('year')} ${g('hour')}:${g('minute')}`;
}
const daysSince = d => { if(!d) return null; const x=(Date.now()-new Date(d))/86400000; return isNaN(x)?null:Math.floor(x); };
const isPast = d => d && new Date(d) < new Date(new Date().toDateString());
const CAT = c => (c||"").toLowerCase();
const hrs = m => (m/60).toFixed(0);
const hrs1 = m => (m/60).toFixed(1);
// Melbourne-local calendar date for an event datetime, weekends folded into the
// work week (Sat -> Fri, Sun -> Mon) so activity always lands on a business day.
const bizDay = iso => {
  const dt=new Date(iso); if(isNaN(dt)) return (iso||"").slice(0,10);
  const s=dt.toLocaleDateString('en-CA',{timeZone:'Australia/Melbourne'}); // YYYY-MM-DD (Melbourne)
  const [y,m,d]=s.split("-").map(Number);
  const x=new Date(y,m-1,d), wd=x.getDay();
  if(wd===0) x.setDate(x.getDate()+1); else if(wd===6) x.setDate(x.getDate()-1);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// activity categories
// mutually-exclusive display bucket: facing > related-only > noncustomer
// (facing is always a subset of "customer related" per the official Activity
// Type definitions — see server.py ACTIVITY_TYPE_MAP)
const CATS = { facing:{lab:"Customer Facing", col:"var(--good)"},
               related:{lab:"Customer Related (non-facing)", col:"var(--accent2)"},
               noncustomer:{lab:"Non-customer", col:"var(--mut)"} };
const QLABELS = {1:"Feb–Apr", 2:"May–Jul", 3:"Aug–Oct", 4:"Nov–Jan"};
const catTag = c => `<span class="ctag" style="background:${(CATS[c]||{}).col||'var(--dim)'}22;color:${(CATS[c]||{}).col||'var(--mut)'}">${(CATS[c]||{}).lab||c}</span>`;
// distinct palette for accounts (separate from the category colors)
const ACCT_PALETTE=["#c792ea","#f78c6c","#42c9c2","#f06292","#82aaff","#c3e88d","#ffcb6b",
  "#e57373","#7e93f0","#4db6ac","#ba68c8","#ffab91","#9ccc65","#26c6da","#d4a5ff","#ff8a65"];
function acctColor(name){
  if(!name) return "var(--dim)";
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return ACCT_PALETTE[h%ACCT_PALETTE.length];
}
function pctMeta(a){
  if(!a || a.currentQuarterVsAvgPct==null) return (a?.currentQuarterEvents||0)+" events";
  const p=a.currentQuarterVsAvgPct, arrow=p>=0?"▲":"▼", col=p>=0?"var(--good)":"var(--bad)";
  return `<span style="color:${col}">${arrow} ${Math.abs(p)}%</span> vs avg quarter · ${a.currentQuarterEvents} events`;
}

let DATA = { forecast:null, whitespace:null, activity:null, movements:null };
// Settings (role mode, ticker toggle, quarterly targets) are file-backed on

let state = { tab:"open", q:"", sortKey:null, sortDir:-1, showDead:false, actMonth:null,
              roleMode:"fsl", showMovements:true, targets:{relatedHrs:250, facingHrs:125},
              alignedSEs:"", showAlignedOnly:false, riskHighlight:false };

// switch tab from anywhere (tab bar, KPI clicks, movement-chip jump, risk-panel toggle)
function switchTab(name){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x.dataset.tab===name));

}

// Aligned-SE helpers: "aligned" = whitespace opp whose Service AE (sfbase__OpportunityTeam__c
// Selling Role = 'Service Cloud AE') matches one of the comma-separated names in Settings.
function alignedList(){
  return (state.alignedSEs||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function isAligned(r){
  const list=alignedList();
  return !!(list.length && r.serviceAE && list.includes(r.serviceAE.trim().toLowerCase()));
}

// live (non-dead) row helpers -------------------------------------------------
const liveRows   = () => ((DATA.forecast?.rows)||[]).filter(r=>!r.isDead);
const openRows   = () => liveRows().filter(r=>!r.isClosed);
const closedRows = () => ((DATA.forecast?.rows)||[]).filter(r=>r.isClosed); // dead handled by toggle

async function fetchAll(){
  const btn=document.getElementById("refresh");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Syncing';
  try {
    const [f,w,a,m] = await Promise.all([
      fetch("/api/forecast").then(r=>r.json()),
      fetch("/api/whitespace?role_mode="+state.roleMode).then(r=>r.json()),
      fetch("/api/activity?role_mode="+state.roleMode).then(r=>r.json()),
      fetch("/api/movements").then(r=>r.json()),
    ]);
    DATA.forecast=f; DATA.whitespace=w; DATA.activity=a; DATA.movements=m;
    setBadge(f,w);

async function refetchMode(){
  const [w,a] = await Promise.all([
    fetch("/api/whitespace?role_mode="+state.roleMode).then(r=>r.json()),
    fetch("/api/activity?role_mode="+state.roleMode).then(r=>r.json()),

}

function setBadge(f,w){
  const b=document.getElementById("s-src"), err=document.getElementById("err");
  if(f.source==="live"){ b.textContent="live"; b.className="badge live"; err.style.display="none"; }
  else if(f.live_via==="mcp"){ b.textContent="Claude snapshot · "+fmtStamp(f.generated); b.className="badge live"; err.style.display="none"; }
  else { b.textContent="snapshot"; b.className="badge snapshot";
    if(f.error||w.error){ err.style.display="block";
      err.textContent="Showing bundled snapshot — no live Org62 connection. "+(f.error||w.error); }
    else err.style.display="none"; }
}

// ---- shared rich hover tooltip (colored, multi-row; native title can't do that) --
function showTip(el, html){
  const tip=document.getElementById("tooltip");
  tip.innerHTML=html;
  tip.style.left="-9999px"; tip.style.top="0px"; tip.style.display="block";
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  const left=Math.min(r.left, window.innerWidth-tw-10);
  let top=r.bottom+6;
  if(top+th>window.innerHeight-10) top=r.top-th-6;
  tip.style.left=Math.max(10,left)+"px"; tip.style.top=Math.max(10,top)+"px";
}
function hideTip(){ document.getElementById("tooltip").style.display="none"; }

// ---- static pipeline-movements strip (top 10 latest, compressed) ----------
const MV_SHOW = 10;
let mvItems = [];
function mvArrow(dir){ return dir==="up"?"▲":dir==="down"?"▼":"•"; }
function mvTipHTML(x){
  const rows=[];
  if(x.stage) rows.push(`<div class="row"><span class="lbl">Stage</span><span class="mv-${x.stage.direction}">${mvArrow(x.stage.direction)} ${esc(x.stage.old)} → ${esc(x.stage.new)}</span></div>`);
  if(x.amount) rows.push(`<div class="row"><span class="lbl">Amount</span><span class="mv-${x.amount.direction}">${mvArrow(x.amount.direction)} ${fmtK(x.amount.old)} → ${fmtK(x.amount.new)} (${x.amount.delta>=0?"+":""}${fmtK(x.amount.delta)})</span></div>`);
  if(x.comment) rows.push(`<div class="row mv-neutral">• New comment logged</div>`);
  return `<div class="acc">${esc(x.account)||"—"}</div>
    <div class="opp">${esc(x.opp)||""}</div>
    ${rows.join("")}
    ${x.date?`<div class="date">${fmtDate(x.date)}</div>`:""}`;
}
function mvChip(x,i){
  const deltas=[];
  if(x.stage) deltas.push(`<span class="delta mv-${x.stage.direction}">${mvArrow(x.stage.direction)} ${esc(stageShort(x.stage.new))}</span>`);
  if(x.amount) deltas.push(`<span class="delta mv-${x.amount.direction}">${mvArrow(x.amount.direction)} ${x.amount.delta>=0?"+":""}${fmtK(x.amount.delta)}</span>`);
  if(x.comment) deltas.push(`<span class="delta mv-neutral">•</span>`);
  return `<div class="mvchip" data-i="${i}">
    <div class="acc">${esc(x.account)||"—"}</div>
    <div class="mv-row">${deltas.join("")}</div>
  </div>`;
}
function renderMovebar(){
  const bar=document.getElementById("movebar"), track=document.getElementById("mvtrack");
  if(!state.showMovements){ bar.style.display="none"; return; }
  mvItems=((DATA.movements?.items)||[]).slice(0, MV_SHOW);
  if(!mvItems.length){ bar.style.display="none"; return; }
  bar.style.display="block";
  track.innerHTML=mvItems.map(mvChip).join("");
}
// click a movement chip -> open its detail drawer + jump to it in the Open Pipe table
function jumpToOpenRow(id){
  if(state.tab!=="open") switchTab("open");
  const tr=document.querySelector(`#view tr[data-id="${id}"]`);
  if(!tr) return;
  tr.scrollIntoView({behavior:"smooth", block:"center"});
  tr.classList.remove("flash"); void tr.offsetWidth; // restart animation if clicked twice
  tr.classList.add("flash");
}
// delegated hover/click -> shared rich tooltip + row jump (movebar track is persistent, chips inside it aren't)
(function(){
  const track=document.getElementById("mvtrack");
  track.addEventListener("mouseover", e=>{
    const chip=e.target.closest(".mvchip"); if(!chip) return;
    const x=mvItems[+chip.dataset.i]; if(!x) return;
    showTip(chip, mvTipHTML(x));
  });
  track.addEventListener("mouseout", e=>{
    const chip=e.target.closest(".mvchip");
    if(!chip || chip.contains(e.relatedTarget)) return;
    hideTip();
  });
  track.addEventListener("click", e=>{
    const chip=e.target.closest(".mvchip"); if(!chip) return;
    const x=mvItems[+chip.dataset.i]; if(!x || !x.id) return;
    hideTip();
    openDetail(x.id);
    jumpToOpenRow(x.id);
  });
})();

// ---- KPI band -------------------------------------------------------------
// "At risk" = open opp flagged by ANY of: stale (no activity >= STALE_DAYS),
// no AE next step logged, or close date already past. Shared by the KPI sum
// and the Open Pipe row-highlight, so they can never drift apart.
function riskRows(){
  return openRows().filter(r=>{const d=daysSince(r.lastActivity);
    return (d!=null&&d>=STALE_DAYS)||!r.aeNotes?.nextStep||isPast(r.close);});
}
function renderKPIs(){
  const won=liveRows().filter(r=>r.isWon), open=openRows();
  const risk=riskRows();
  const closedWon=won.reduce((s,r)=>s+(r.amount||0),0);
  const pipeline=open.reduce((s,r)=>s+(r.amount||0),0);
  const atRisk=risk.reduce((s,r)=>s+(r.amount||0),0);
  const act=DATA.activity||{};
  const wsRows=(DATA.whitespace?.rows)||[];
  const aligned=wsRows.filter(isAligned);
  const alignedTotal=aligned.reduce((s,r)=>s+(r.amount||0),0);
  const kpis=[
    {lab:"Closed Won (FY27)", val:fmtK(closedWon), meta:won.length+" deals won", tab:"closed"},
    {lab:"Open Pipeline",     val:fmtK(pipeline),  meta:open.length+" open opps", tab:"open"},
    {lab:"Pipeline at Risk",  val:fmtK(atRisk),    meta:risk.length+" flagged", cls:"risk", key:"risk"},
    {lab:"New Business (ANZ)",val:fmtK(DATA.whitespace?.total),
     meta:(DATA.whitespace?.count||0)+" white-space opps<br>"+aligned.length+" Aligned ("+fmtK(alignedTotal)+")", tab:"whitespace"},
    {lab:"Time Spent (Qtr)",  val:act.currentQuarterMinutes!=null?hrs(act.currentQuarterMinutes)+" h":"—", meta:pctMeta(act), cls:"time", tab:"activity"},
    {lab:"Dead / Excluded",   val:String(((DATA.forecast?.rows)||[]).filter(r=>r.isDead).length), meta:"omitted from KPIs"},
  ];
  document.getElementById("kpis").innerHTML=kpis.map(k=>`
    <div class="kpi ${k.cls||''}${k.key==='risk'&&state.riskHighlight?' active':''}"
         ${k.key?`data-key="${k.key}"`:''} ${k.tab?`data-tab="${k.tab}"`:''}>
      <div class="lab">${k.lab}</div>
      <div class="val">${k.val}</div>
      <div class="meta">${k.meta}</div>
    </div>`).join("");
  document.querySelectorAll(".kpi[data-tab]").forEach(el=>{
    el.onclick=()=>{
      // clicking any other KPI drops the Pipeline-at-Risk highlight/panel
      if(state.riskHighlight){ state.riskHighlight=false; renderKPIs(); renderRiskPanel(); }
      switchTab(el.dataset.tab);
    };
  });
  const riskEl=document.querySelector('.kpi[data-key="risk"]');
  if(riskEl) riskEl.onclick=toggleRiskPanel;
}
// click "Pipeline at Risk" -> highlight matching rows in Open Pipe + explain the logic below the KPI band
function toggleRiskPanel(){
  state.riskHighlight=!state.riskHighlight;
  if(state.riskHighlight && state.tab!=="open") switchTab("open");
  renderKPIs(); renderRiskPanel(); render();
}
function renderRiskPanel(){
  const panel=document.getElementById("risk-panel");
  if(!state.riskHighlight){ panel.style.display="none"; return; }
  const risk=riskRows();
  const staleN=risk.filter(r=>{const d=daysSince(r.lastActivity); return d!=null&&d>=STALE_DAYS;}).length;
  const noNextN=risk.filter(r=>!r.aeNotes?.nextStep).length;
  const pastN=risk.filter(r=>isPast(r.close)).length;
  const total=risk.reduce((s,r)=>s+(r.amount||0),0);
  panel.style.display="block";
  panel.innerHTML=`<h3>⚠ Pipeline at Risk — why these opps are flagged</h3>
    <div class="muted">An open opp counts as "at risk" if <b>any</b> of these are true:</div>
    <div class="risk-rules">
      <div>• Stale — no activity logged in ${STALE_DAYS}+ days &nbsp; <b>${staleN}</b></div>
      <div>• No AE next step logged &nbsp; <b>${noNextN}</b></div>
      <div>• Close date already in the past &nbsp; <b>${pastN}</b></div>
    </div>
    <div class="muted">${risk.length} opp(s) · ${fmtK(total)} — highlighted in the Open Pipe table below.</div>`;
}

// ---- shared cell renderers ------------------------------------------------
function catPill(c){
  const k=CAT(c);
  if(k.includes("commit")) return `<span class="pill commit">Commit</span>`;
  if(k.includes("best"))   return `<span class="pill best">Best Case</span>`;
  if(k.includes("closed")||k.includes("won")) return `<span class="pill closed">Closed</span>`;
  return `<span class="pill pipe">Pipeline</span>`;
}
function oppLink(r){
  const nm=esc(r.name||"—");
  return r.id ? `<a href="${SF}${r.id}/view" target="_blank" rel="noopener">${nm}</a>` : nm;
}
function coachFlags(r){
  const out=[]; const d=daysSince(r.lastActivity);
  if(isPast(r.close)&&!r.isClosed) out.push(`<span class="flag past">CLOSE DATE PAST</span>`);
  if(d!=null&&d>=STALE_DAYS) out.push(`<span class="flag stale">STALE ${d}d</span>`);
  if(!r.aeNotes?.nextStep) out.push(`<span class="flag nns">NO NEXT STEP</span>`);
  if(r.amount==null) out.push(`<span class="flag noamt">NO AMOUNT</span>`);
  return out;
}

// ---- tab views ------------------------------------------------------------
function viewOpen(){
  const open=openRows();
  const groups=[
    {label:"Commit", key:"commit", col:"var(--good)"},
    {label:"Best Case", key:"best", col:"var(--accent2)"},
    {label:"Pipeline", key:"pipeline", col:"var(--mut)"},
  ];
  const target=open.reduce((s,r)=>s+(r.amount||0),0)||1; // no quota field verified — target = total open pipe
  const stats=groups.map(g=>{
    const rs=open.filter(r=>CAT(r.category).includes(g.key));
    const v=rs.reduce((s,r)=>s+(r.amount||0),0);
    return {...g, n:rs.length, v, pct:Math.min(100,Math.round(v/target*100))};
  });
  const bar=stats.map(s=>`<i style="width:${s.pct}%;background:${s.col}"></i>`).join("");
  const rows=stats.map(s=>`<div class="r"><b class="dot" style="background:${s.col}"></b>${s.label}: <b>${s.n}</b> opps · <b>${fmt(s.v)}</b> · <b>${s.pct}%</b></div>`).join("");
  const mix=`<div class="card fmix"><h3>Forecast mix</h3><div class="fmix-bar">${bar}</div><div class="fmix-rows">${rows}</div></div>`;
  const riskIds=state.riskHighlight?new Set(riskRows().map(r=>r.id)):null;
  return mix + table(open,[
    {k:"category",t:"Cat",render:catPill},
    {k:"name",t:"Opportunity",render:(_,r)=>oppLink(r)},
    {k:"account",t:"Account"},
    {k:"stage",t:"Stage",render:stageShort},
    {k:"coreSE",t:"Core SE"},
    {k:"serviceAE",t:"Service AE",render:v=>esc(v)||"—"},
    {k:"close",t:"Close",cls:"close",render:fmtDate},
    {k:"amount",t:"Amount",num:true,fmt:fmt},
    {k:"lastActivity",t:"Last activity",render:v=>{const d=daysSince(v);
      return d!=null&&d>=STALE_DAYS?`<span class="flag stale">${fmtDate(v)} ⚠</span>`:fmtDate(v);}},
  ], riskIds?r=>riskIds.has(r.id)?"risk-row":"":null);
}

function viewActivity(){
  const a=DATA.activity; if(!a) return `<div class="note">No activity data.</div>`;
  const catBy=Object.fromEntries((a.byCategory||[]).map(c=>[c.category,c]));
  // this-quarter summary + category cards

  const pctStr=pct==null?"":`<span style="color:${pct>=0?'var(--good)':'var(--bad)'}">${pct>=0?'▲':'▼'} ${Math.abs(pct)}%</span> vs avg quarter (${hrs(a.avgQuarterlyMinutes)} h)`;
  const summary=`<div class="card"><h3>This quarter (${QLABELS[a.currentQuarter]||''})</h3>

      <div class="row"><span class="k">FY total</span><b>${hrs(a.totalMinutes)} h · ${a.totalEvents} ev</b></div></div>`;

      <div class="vbar"><i style="width:${p}%;background:${CATS[k].col}"></i></div></div>`;
  }).join("");
  // stacked quarterly bars (facing / related / marketing / non-customer)
  const maxM=Math.max(1,...(a.byQuarter||[]).map(m=>m.minutes));
  const bars=(a.byQuarter||[]).map(m=>{
    const seg=k=>{const h=Math.round((m[k]||0)/maxM*120);return h>0?`<i style="height:${h}px;background:${CATS[k].col}"></i>`:"";};
    return `<div class="m" title="${m.count} events · ${hrs(m.minutes)}h — Facing ${hrs(m.facing)}h / Related (non-facing) ${hrs(m.related)}h / Non ${hrs(m.noncustomer)}h">

  const legend=Object.keys(CATS).map(k=>`<span><b style="background:${CATS[k].col}"></b>${CATS[k].lab}</span>`).join("");
  // quarterly targets vs actual, with a pro-rata (days-elapsed-in-quarter) marker
  const cq=(a.byQuarter||[]).find(q=>q.quarter===a.currentQuarter)||{};
  const pq=(a.byQuarter||[]).find(q=>q.quarter===a.currentQuarter-1);
  const proRataPct=Math.min(100,(a.currentQuarterProgress||{}).pct||0);
  const tgRow=(label,color,curMin,targetHrs,prevMin)=>{
    const cur=(curMin||0)/60, tgt=targetHrs||0;
    const pct=tgt?Math.round(cur/tgt*100):0;
    const fillPct=Math.min(100,pct);
    const prevStr=pq===undefined?"—":`${((prevMin||0)/60).toFixed(1)}/${tgt} Hrs (${tgt?Math.round((prevMin||0)/60/tgt*100):0}%)`;
    return `<div class="tgrow">
      <div class="tgtop"><span>${label}</span><b>${cur.toFixed(1)} / ${tgt} Hrs (${pct}%)</b></div>
      <div class="tgwrap"><div class="tgbar"><div class="tgfill" style="width:${fillPct}%;background:${color}"></div></div>
        <div class="tgmark" style="left:${proRataPct}%" title="Pro-rata: ${proRataPct}% of quarter elapsed"></div></div>
      <div class="tgmeta muted">Pro-rata today: ${(tgt*proRataPct/100).toFixed(1)} Hrs · Prev Qtr ${prevStr}</div></div>`;
  };
  // Customer Related target = ALL related time, facing included (facing is a
  // subset of related per the official Activity Type definitions).
  const relSuper = q => q ? (q.facing||0)+(q.related||0) : undefined;
  const targetsCard=`<div class="card"><h3>Quarterly targets — ${QLABELS[a.currentQuarter]||''}</h3>
    ${tgRow("Customer Related", CATS.related.col, relSuper(cq), state.targets.relatedHrs, relSuper(pq))}
    ${tgRow("Customer Facing", CATS.facing.col, cq.facing, state.targets.facingHrs, pq?.facing)}
    </div>`;
  // Alerts — activity on DEAD opportunities in the last 7 days
  const alerts=a.alerts||[];
  const alertRows=alerts.length?alerts.map(x=>`<div class="alertitem">
      <div>${oppLinkId(x.whatId,x.opp)} <span class="pill dead">${esc(x.stage)||"Dead"}</span></div>
      <div class="meta">${esc(x.account)||"—"} · ${fmt(x.amount)} · close ${fmtDate(x.close)}</div>
      <div class="meta"><b>${(x.minutes/60).toFixed(1)} h</b> across ${x.events} event${x.events==1?"":"s"} · latest ${fmtDate(x.latestDate)}: ${esc(x.latestSubject)||"(no subject)"}</div></div>`).join("")
    : `<div class="muted">No activity logged against dead opportunities in the last 7 days. ✅</div>`;
  const alertCard=`<div class="card alert"><h3>⚠ Dead-deal activity · last 7 days (${alerts.length})</h3>${alertRows}</div>`;
  // Coverage gaps — business opps in my active accounts where I'm not the contributor
  const gaps=a.coverageGaps||[];
  const gapRows=gaps.length?gaps.map(g=>`<tr>
      <td>${esc(g.account)||"—"}</td>
      <td>${oppLinkId(g.id,g.name)}</td>
      <td><span class="chip">${esc(g.type)}</span></td>
      <td>${esc(g.stage)||"—"}</td>
      <td class="num amt">${fmt(g.amount)}</td>
      <td class="close">${fmtDate(g.close)}</td>
      <td>${esc(g.owner)||"—"}</td></tr>`).join("")
    : `<tr><td colspan="7" class="muted">No coverage gaps — you're on every business opp in your active accounts. ✅</td></tr>`;
  const gapCard=`<div class="card alert"><h3>⚑ Coverage gaps · not on the deal (${gaps.length} · ${fmtK(a.coverageGapTotal)})</h3>
    <div class="muted" style="margin-bottom:8px">Open New/Add-On opps in accounts you're working this FY where you're not the SE contributor.</div>
    <div class="scroll"><table class="ptable"><thead><tr><th>Account</th><th>Opportunity</th><th>Type</th><th>Stage</th><th class="num">Amount</th><th class="close">Close</th><th>Owner</th></tr></thead><tbody>${gapRows}</tbody></table></div></div>`;
  // Last 14 days — time spent per account (via related opportunity)
  const l14=a.last14ByAccount||[];
  const l14Rows=l14.length?l14.map(x=>{
    const top=(x.opps&&x.opps[0])||{}; const more=(x.opps||[]).length-1;
    return `<tr>
      <td><span class="adot" style="background:${acctColor(x.account)}"></span>${esc(x.account)||"—"}</td>
      <td class="num amt">${hrs1(x.minutes)} h</td>
      <td class="num">${x.events||0}</td>
      <td>${oppLinkId(top.whatId,top.name)}${more>0?` <span class="muted">+${more}</span>`:""}${top.dead?` <span class="pill dead">Dead</span>`:""}</td>
      <td class="num amt">${fmt(top.amount)}</td>
      <td class="close">${fmtDate(top.close)}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="muted">No customer activity in the last 14 days.</td></tr>`;
  const l14Card=`<div class="card"><h3>Time spent by account · last 14 days</h3>
    <table class="ptable"><tr><th>Account</th><th class="num">Time</th><th class="num">Activities</th><th>Top opportunity</th><th class="num">Amount</th><th class="close">Close</th></tr>${l14Rows}</table></div>`;
  return `<div class="ttrack">${summary}${catCards}</div>
    ${targetsCard}
    <div class="card"><h3>Time spent by quarter — by category</h3><div class="months">${bars}</div>
      <div class="legend">${legend}</div></div>
    ${alertCard}
    ${gapCard}
    ${l14Card}
    <div class="sect"><h4>Activity calendar</h4>${calendarHtml(a.recent||[])}</div>`;
}

// rich tooltip content for one calendar day's account-grouped activity chip
let calTipGroups = [];
function calEvTipHTML(g){
  const rows=g.evs.map(e=>`<div class="row"><span class="lbl">${e.mins}m</span><span>${esc(e.subject||"(untitled)")}</span></div>`).join("");
  return `<div class="acc" style="color:${acctColor(g.account)}">${esc(g.account)||"—"}</div>
    <div class="opp">${(g.mins/60).toFixed(1)}h total · ${g.evs.length} activit${g.evs.length===1?"y":"ies"}</div>
    ${rows}`;
}
// month calendar of recent activity ------------------------------------------
function calendarHtml(events){
  calTipGroups=[];
  if(!state.actMonth){ const t=new Date(); state.actMonth=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0"); }
  const [Y,M]=state.actMonth.split("-").map(Number);
  const byDay={}; let monMin=0, monN=0; const monAccts=new Set();
  events.forEach(e=>{ const ds=bizDay(e.date); if(!ds||ds.slice(0,7)!==state.actMonth) return;
    (byDay[ds]=byDay[ds]||[]).push(e); monMin+=e.mins||0; monN++; if(e.account) monAccts.add(e.account); });
  const days=new Date(Y,M,0).getDate();
  const todayStr=bizDay(new Date().toISOString());
  const dow=["Mon","Tue","Wed","Thu","Fri"].map(d=>`<div class="dow">${d}</div>`).join("");
  let cells="", placed=false;
  for(let d=1;d<=days;d++){
    const wd=new Date(Y,M-1,d).getDay();
    if(wd===0||wd===6) continue;              // skip weekends — 5-day work week
    if(!placed){ for(let i=0;i<wd-1;i++) cells+=`<div class="cell empty"></div>`; placed=true; }
    const ds=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs=byDay[ds]||[];
    const dm=evs.reduce((s,e)=>s+(e.mins||0),0);
    // group same-account activities into one chip per account
    const groups={};
    evs.forEach(e=>{ const k=e.account||"—"; (groups[k]=groups[k]||{account:e.account,mins:0,evs:[]}); groups[k].mins+=e.mins||0; groups[k].evs.push(e); });
    const chips=Object.values(groups).sort((a,b)=>b.mins-a.mins).map(g=>{
      const label=(g.account||"—")+(g.evs.length>1?` · ${g.evs.length}`:"");
      const ci=calTipGroups.length; calTipGroups.push(g);
      return `<div class="ev" style="border-left-color:${acctColor(g.account)}" data-ci="${ci}">${esc(label)}<span class="evh">${(g.mins/60).toFixed(1)}h</span></div>`;
    }).join("");
    cells+=`<div class="cell${ds===todayStr?' today':''}">
      <div class="dnum">${d}${dm?`<span class="dmin">${(dm/60).toFixed(1)}h</span>`:""}</div>${chips}</div>`;
  }
  // account legend for accounts appearing this month
  const accts=[...monAccts].sort();
  const legend=accts.map(n=>`<span><b style="background:${acctColor(n)}"></b>${esc(n)}</span>`).join("");
  return `<div class="calbar">
      <button id="cal-prev">‹</button>
      <b>${MONTHS[M-1]} ${Y}</b>
      <button id="cal-next">›</button>
      <span class="muted">${monN} events · ${(monMin/60).toFixed(1)} h</span></div>
    <div class="cal">${dow}${cells}</div>
    ${legend?`<div class="acctlegend">${legend}</div>`:""}`;
}
function shiftMonth(delta){
  let [Y,M]=state.actMonth.split("-").map(Number); M+=delta;
  if(M<1){M=12;Y--;} if(M>12){M=1;Y++;}
  state.actMonth=Y+"-"+String(M).padStart(2,"0");
}
function oppLinkId(id,name){
  const nm=esc(name||"—");
  return id?`<a href="${SF.replace('/Opportunity/','/')}${esc(id)}/view" target="_blank" rel="noopener">${nm}</a>`:nm;
}

// ---- generic sortable/filterable table ------------------------------------
function table(rows, cols, rowClass){
  const q=state.q.toLowerCase();
  let rs=rows.filter(r=>!q||[r.name,r.account,r.owner,r.stage].some(v=>(v||"").toLowerCase().includes(q)));
  if(state.sortKey){ const k=state.sortKey, dir=state.sortDir;
    rs=rs.slice().sort((a,b)=>{ let x=a[k],y=b[k];
      if(typeof x==="number"||typeof y==="number"){x=x||0;y=y||0;return (x-y)*dir;}
      return String(x||"").localeCompare(String(y||""))*dir; }); }
  const head="<tr>"+cols.map(c=>`<th class="${c.num?'num':''} ${c.cls||''}" data-k="${c.k}">${c.t}${state.sortKey===c.k?(state.sortDir<0?" ▼":" ▲"):""}</th>`).join("")+"</tr>";
  const body=rs.length?rs.map(r=>`<tr data-id="${esc(r.id||'')}" class="${rowClass?rowClass(r):''}">`+cols.map(c=>{
      const v=r[c.k];
      const cell=c.render?c.render(v,r):(c.fmt?`<span class="amt">${c.fmt(v)}</span>`:(v==null?"—":esc(v)));
      return `<td class="${c.num?'num':''} ${c.cls||''}">${cell}</td>`;
    }).join("")+"</tr>").join("") : `<tr><td colspan="${cols.length}" class="muted">No rows.</td></tr>`;
  return `<div class="bar"><input id="q" type="search" placeholder="Filter by name / account / owner / stage…" value="${esc(state.q)}"></div>
          <table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// ---- detail drawer --------------------------------------------------------
function findRow(id){
  return ((DATA.forecast?.rows)||[]).find(r=>r.id===id) || ((DATA.whitespace?.rows)||[]).find(r=>r.id===id);
}
function noteBlock(lbl,txt){ return txt?`<div class="notebox"><div class="lbl">${lbl}</div>${esc(txt)}</div>`:""; }
function openDetail(id){
  const r=findRow(id); if(!r) return;
  const se=r.seNotes||{}, ae=r.aeNotes||{};
  const acts=(r.activity||[]).slice(0,8).map(e=>`<div class="actitem"><div>${esc(e.subject)||"(no subject)"}</div>
      <div class="meta">${fmtDate(e.date)} · ${esc(e.type)} · ${e.mins} min</div></div>`).join("");
  const notes=[noteBlock("SE Comments"+(se.commentDate?` · ${fmtDate(se.commentDate)}`:""),se.comments),
               noteBlock("SE Next Steps",se.nextSteps),
               noteBlock("Architect Comments",se.architect),
               noteBlock("Tech Exec Comments",se.techExec)].join("");
  const aenotes=[noteBlock("AE Next Step",ae.nextStep),noteBlock("AE Description",ae.description)].join("");
  document.getElementById("drawer-inner").innerHTML=`
    <div class="dh">
      <h2>${r.id?`<a href="${SF}${r.id}/view" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`:esc(r.name)}</h2>
      <span class="close" id="dclose">×</span>
    </div>
    <div class="body">
      <div class="kv"><span class="k">Account</span><span>${esc(r.account)||"—"}</span></div>
      <div class="kv"><span class="k">Core AE</span><span>${esc(r.owner)||"—"}</span></div>
      <div class="kv"><span class="k">Core SE</span><span>${esc(r.coreSE)||"—"}</span></div>
      <div class="kv"><span class="k">Service AE</span><span>${esc(r.serviceAE)||"—"}</span></div>
      <div class="kv"><span class="k">Stage</span><span>${esc(r.stage)||"—"}</span></div>
      <div class="kv"><span class="k">Close</span><span>${fmtDate(r.close)}</span></div>
      <div class="kv"><span class="k">Amount</span><span class="amt">${fmt(r.amount)}</span></div>
      <div class="sect"><h4>SE notes</h4>${notes||`<div class="muted">No SE notes.</div>`}</div>
      <div class="sect"><h4>AE notes &amp; activity</h4>${aenotes||`<div class="muted">No AE notes.</div>`}${acts||""}</div>
      <div class="sect"><h4 id="prod-h">Products</h4><div id="prod-body" class="muted">Loading products…</div></div>
    </div>`;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("scrim").style.display="block";
  document.getElementById("dclose").onclick=closeDetail;
  if(r.id) loadProducts(r.id); else document.getElementById("prod-body").textContent="No line items.";
}
async function loadProducts(id){
  try {
    const d=await fetch(`/api/opportunity/${id}/products`).then(r=>r.json());
    const rows=d.rows||[];
    const h=document.getElementById("prod-h"), b=document.getElementById("prod-body");
    if(!h||!b) return; // drawer closed / a different opp opened before this resolved
    h.textContent=`Products (${rows.length})`;
    b.innerHTML=rows.length?`<table class="ptable"><tr><th>Product</th><th class="num">Qty</th><th class="num">Total</th></tr>${
      rows.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.qty??"—"}</td><td class="num">${fmt(p.total)}</td></tr>`).join("")
    }</table>` : `<div class="muted">No line items.</div>`;
  } catch(e){
    const b=document.getElementById("prod-body");
    if(b) b.textContent="Failed to load products.";
  }
}
function closeDetail(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").style.display="none";
}
document.getElementById("scrim").onclick=closeDetail;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });

// ---- render ---------------------------------------------------------------
const VIEWS={open:viewOpen,closed:viewClosed,whitespace:viewWhitespace,coach:viewCoach,activity:viewActivity};
function render(){
  document.getElementById("view").innerHTML=VIEWS[state.tab]();
  const q=document.getElementById("q");
  if(q){ q.oninput=e=>{ state.q=e.target.value; const p=q.selectionStart; render();
           const n=document.getElementById("q"); if(n){n.focus(); n.setSelectionRange(p,p);} }; }
  document.querySelectorAll("#view th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=-1;}
    render();
  });
  document.querySelectorAll("#view tr[data-id]").forEach(tr=>{
    if(!tr.dataset.id) return;
    tr.onclick=e=>{ if(e.target.tagName==="A") return; openDetail(tr.dataset.id); };
  });
  const dt=document.getElementById("deadtog");
  if(dt) dt.onchange=e=>{ state.showDead=e.target.checked; render(); };
  const at=document.getElementById("aligntog");
  if(at) at.onchange=e=>{ state.showAlignedOnly=e.target.checked; render(); };
  const cp=document.getElementById("cal-prev"), cn=document.getElementById("cal-next");
  if(cp) cp.onclick=()=>{ shiftMonth(-1); render(); };
  if(cn) cn.onclick=()=>{ shiftMonth(1); render(); };
  document.querySelectorAll(".cal .ev").forEach(el=>{
    el.onmouseenter=()=>showTip(el, calEvTipHTML(calTipGroups[+el.dataset.ci]));
    el.onmouseleave=hideTip;
  });
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
document.getElementById("refresh").onclick=fetchAll;

// ---- settings popover -------------------------------------------------------
const settingsBtn=document.getElementById("settings-btn"), settingsPop=document.getElementById("settings-pop");
settingsBtn.onclick=e=>{ e.stopPropagation(); settingsPop.classList.toggle("open"); };
settingsPop.onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>settingsPop.classList.remove("open"));

function syncSettingsUI(){
  document.querySelectorAll("#role-seg button").forEach(b=>b.classList.toggle("active", b.dataset.mode===state.roleMode));
  document.getElementById("movetog").checked=state.showMovements;
  document.getElementById("tg-related").value=state.targets.relatedHrs;
  document.getElementById("tg-facing").value=state.targets.facingHrs;
  document.getElementById("aligned-ses").value=state.alignedSEs;
}
document.querySelectorAll("#role-seg button").forEach(b=>b.onclick=()=>{
  if(state.roleMode===b.dataset.mode) return;
  state.roleMode=b.dataset.mode; saveSettings(); syncSettingsUI(); refetchMode();
});
document.getElementById("movetog").onchange=e=>{
  state.showMovements=e.target.checked; saveSettings(); renderMovebar();
};
function tgInput(id,key){
  document.getElementById(id).onchange=e=>{
    const v=parseFloat(e.target.value);
    if(!isNaN(v) && v>=0){ state.targets[key]=v; saveSettings(); if(state.tab==="activity") render(); }
  };
}
tgInput("tg-related","relatedHrs");
tgInput("tg-facing","facingHrs");
document.getElementById("aligned-ses").onchange=e=>{
  state.alignedSEs=e.target.value; saveSettings(); renderKPIs(); if(state.tab==="whitespace") render();
};

document.getElementById("app-ver").textContent = APP_VERSION;

(async function boot(){
  const s = await loadSettings();
  state.roleMode = s.roleMode || "fsl";
  state.showMovements = s.showMovements !== undefined ? s.showMovements : true;
  state.targets = s.targets || {relatedHrs:250, facingHrs:125};
  state.alignedSEs = s.alignedSEs || "";
  syncSettingsUI();
  fetchAll();
})();
</script>
</body>
